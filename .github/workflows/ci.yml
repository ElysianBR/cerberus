name: CI Cerberus Tests

on:
  push:
  pull_request:
  schedule:
    - cron: '0 15 * * *'

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Configuração do Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '20.9.0' 

    - name: Instalação de Dependências (UI)
      run: npm install
      working-directory: ./cypress-web-tests

    - name: Executar Testes de UI
      run: npm run cy:run
      working-directory: ./cypress-web-tests

    - name: Gerar Relatório Cypress
      run: npm run generate-report
      working-directory: ./cypress-web-tests

    - name: Upload Mochawesome Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mochawesome-report
        path: ./cypress-web-tests/cypress/reports

    - name: Publicar Resumo do Cypress
      run: |
        npx cypress run --reporter json > cypress-web-tests/cypress/reports/results.json
        npx mochawesome-merge cypress-web-tests/cypress/reports/*.json > cypress-web-tests/cypress/reports/merged-report.json
        npx marge cypress-web-tests/cypress/reports/merged-report.json --reportDir cypress-web-tests/cypress/reports --inline
      working-directory: ./cypress-web-tests

    - name: Download Mochawesome Report
      uses: actions/download-artifact@v4
      with:
        name: mochawesome-report
        path: download-mochawesome-report
