name: CI Cerberus Tests

on:
  push:
  pull_request:
  schedule:
    - cron: '0 23 * * *'
    - cron: '05 23 * * *'
    - cron: '10 23 * * *'
    - cron: '15 23 * * *'
    - cron: '20 23 * * *'
    - cron: '25 23 * * *'
    - cron: '30 23 * * *'
    - cron: '35 23 * * *'
    - cron: '40 23 * * *'
    - cron: '45 23 * * *'
    - cron: '50 23 * * *'
    - cron: '55 23 * * *'
    - cron: '0 0 * * *'

jobs:
